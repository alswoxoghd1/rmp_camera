/**:
  ros__parameters:
    global_frame: "base_link"
    pose_frame: "base_link"
    map_clearing_frame_id: "base_link"
    esdf_slice_bounds_visualization_attachment_frame_id: "base_link"
    workspace_height_bounds_visualization_attachment_frame_id: "base_link"

    use_tf_transforms: true
    use_depth: true
    use_color: true
    use_lidar: false
    input_qos: "SENSOR_DATA"

    esdf_mode: "3d"
    publish_esdf_distance_slice: true

    static_mapper:
      esdf_integrator_max_distance_m: 2.0
      # Raised from 0.1 -> 0.3: filters out voxels that only accumulated weight from a
      # single noisy/transient depth observation (a common source of false obstacle
      # spheres in empty space). The D435 is static here and continuously re-observes
      # the same workspace every depth frame, so a real obstacle surface accumulates
      # weight every frame and crosses 0.3 within a few frames (well under a second) of
      # first being seen -- clearance for genuine obstacles is unaffected once the map
      # has warmed up. Only the map's initial warm-up latency after start (or after an
      # obstacle first appears) increases slightly.
      esdf_integrator_min_weight: 0.3
      esdf_slice_height: 0.5
      esdf_slice_min_height: 0.35
      esdf_slice_max_height: 0.75
      projective_integrator_max_integration_distance_m: 5.0
